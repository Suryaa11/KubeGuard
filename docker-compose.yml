version: '3.9'

services:
  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GATEWAY_PORT: 3000
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PROJECT_SERVICE_URL: http://project-service:3001
      WATCHER_SERVICE_URL: http://watcher-service:3002
      ANALYSIS_SERVICE_URL: http://analysis-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on: []
    restart: unless-stopped

  project-service:
    build: ./project-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PROJECT_PORT: 3001
      MONGODB_URI: ${MONGODB_URI}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL}
    restart: unless-stopped

  watcher-service:
    build: ./watcher-service
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WATCHER_PORT: 3002
      MONGODB_URI: ${MONGODB_URI}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      PROJECT_SERVICE_URL: http://project-service:3001
      ANALYSIS_SERVICE_URL: http://analysis-service:3003
    depends_on:
      - project-service
    restart: unless-stopped

  analysis-service:
    build: ./analysis-service
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ANALYSIS_PORT: 3003
      MONGODB_URI: ${MONGODB_URI}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      AI_API_URL: ${AI_API_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-kubeguard-reports}
      SERVICE_BUS_CONNECTION_STRING: ${SERVICE_BUS_CONNECTION_STRING}
      SERVICE_BUS_QUEUE: ${SERVICE_BUS_QUEUE:-report-ready}
      PROJECT_SERVICE_URL: http://project-service:3001
      WATCHER_SERVICE_URL: http://watcher-service:3002
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    depends_on:
      - project-service
      - watcher-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID}
        VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "80:80"
    depends_on:
      - project-service
      - watcher-service
      - analysis-service
      - gateway
    restart: unless-stopped
