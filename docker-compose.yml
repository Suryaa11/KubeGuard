version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    env_file: ./gateway/.env.docker
    depends_on:
      - project-service
      - watcher-service
      - analysis-service
      - notification-service
    restart: unless-stopped

  project-service:
    build: ./project-service
    ports:
      - "3001:3001"
    env_file: ./project-service/.env.docker
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  watcher-service:
    build: ./watcher-service
    ports:
      - "3002:3002"
    env_file: ./watcher-service/.env.docker
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  analysis-service:
    build: ./analysis-service
    ports:
      - "3003:3003"
    env_file: ./analysis-service/.env.docker
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    ports:
      - "3004:3004"
    env_file: ./notification-service/.env.docker
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data: