  #     INTERNAL_SECRET: "kube-guard-internal-secret-key-2024-vm-test"
  #     NOTIFICATION_SECRET: "KubeGuard-Notif-Secret-Key32charsOK!"
  #     SERVICE_BUS_CONNECTION_STRING: "YOUR_SERVICE_BUS_CONNECTION_STRING_HERE"
  #     SERVICE_BUS_QUEUE: "report-ready"
